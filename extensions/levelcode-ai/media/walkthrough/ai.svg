<svg viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Native AI chat, inline completions, and an agent built into the editor" style="color: var(--vscode-foreground, #b9b7b1); max-width: 100%; height: auto;">
  <!-- editor window -->
  <rect x="58" y="66" width="604" height="288" rx="16" stroke="currentColor" stroke-opacity="0.26" stroke-width="2"/>
  <line x1="58" y1="112" x2="662" y2="112" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="86" cy="89" r="4.5" fill="currentColor" fill-opacity="0.28"/>
  <circle cx="104" cy="89" r="4.5" fill="currentColor" fill-opacity="0.28"/>
  <circle cx="122" cy="89" r="4.5" fill="currentColor" fill-opacity="0.28"/>

  <!-- code (left) -->
  <g>
    <rect x="86" y="146" width="176" height="11" rx="5.5" fill="currentColor" fill-opacity="0.17"/>
    <rect x="86" y="174" width="236" height="11" rx="5.5" fill="currentColor" fill-opacity="0.17"/>
    <rect x="110" y="202" width="146" height="11" rx="5.5" fill="currentColor" fill-opacity="0.17"/>
    <rect x="110" y="230" width="196" height="11" rx="5.5" fill="currentColor" fill-opacity="0.17"/>
    <rect x="86" y="258" width="112" height="11" rx="5.5" fill="currentColor" fill-opacity="0.17"/>
    <!-- inline completion (ghost, violet dashed) -->
    <rect x="206" y="258" width="140" height="11" rx="5.5" fill="#7C5CD6" fill-opacity="0.16" stroke="#7C5CD6" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- chat panel (right) -->
  <rect x="416" y="134" width="220" height="188" rx="13" fill="#7C5CD6" fill-opacity="0.06" stroke="#7C5CD6" stroke-opacity="0.34" stroke-width="1.5"/>
  <rect x="438" y="160" width="118" height="12" rx="6" fill="currentColor" fill-opacity="0.20"/>
  <rect x="438" y="182" width="162" height="12" rx="6" fill="currentColor" fill-opacity="0.13"/>
  <rect x="474" y="228" width="140" height="12" rx="6" fill="#7C5CD6" fill-opacity="0.30"/>
  <rect x="516" y="250" width="98" height="12" rx="6" fill="#7C5CD6" fill-opacity="0.30"/>
  <rect x="438" y="288" width="176" height="20" rx="10" stroke="#7C5CD6" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- AI sparks -->
  <path d="M360 92 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11 z" fill="#7C5CD6"/>
  <path d="M326 150 l5.5 14 14 5.5 -14 5.5 -5.5 14 -5.5 -14 -14 -5.5 14 -5.5 z" fill="#7C5CD6" opacity="0.55"/>
</svg>
