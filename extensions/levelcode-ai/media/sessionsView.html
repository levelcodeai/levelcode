<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --cc-bg:#282c34; --cc-surface:#21252b; --cc-text:#dcdfe4; --cc-text2:#abb2bf; --cc-text3:#828997; --cc-line:#3e4451; --cc-accent:#7d6bff; --cc-warn:#d19a66; --cc-danger:#e06c75; }
  body.vscode-light { --cc-bg:#ffffff; --cc-surface:#fafaf9; --cc-text:#333; --cc-text2:#555; --cc-text3:#777; --cc-line:#e0e0e0; --cc-accent:#5b3fd6; --cc-warn:#b9761f; --cc-danger:#d9534f; }
  body.vscode-high-contrast, body.vscode-high-contrast-light {
    --cc-bg: var(--vscode-editor-background); --cc-surface: var(--vscode-sideBar-background, var(--vscode-editor-background));
    --cc-text: var(--vscode-foreground); --cc-text2: var(--vscode-foreground); --cc-text3: var(--vscode-descriptionForeground, var(--vscode-foreground));
    --cc-line: var(--vscode-contrastBorder, var(--vscode-widget-border)); --cc-accent: var(--vscode-textLink-foreground, var(--vscode-focusBorder));
    --cc-warn: var(--vscode-editorWarning-foreground, var(--vscode-foreground)); --cc-danger: var(--vscode-errorForeground); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--cc-surface); color: var(--cc-text); font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); font-variant-numeric: tabular-nums; }
  .sessview { display: flex; flex-direction: column; height: 100vh; }
  .sessnew { margin: 2px 10px 8px; padding: 7px 10px; background: var(--cc-bg); border: 1px solid var(--cc-line); border-radius: 6px; color: var(--cc-text); font: inherit; font-size: 12.5px; cursor: pointer; text-align: center; }
  .sessnew:hover { border-color: var(--cc-accent); }
  /* Undo toast pinned at the foot after Done/Delete (an accidental click is recoverable). */
  .sessundo { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 10px 10px; padding: 8px 11px; background: var(--cc-bg); border: 1px solid var(--cc-line); border-radius: 8px; font-size: 12.5px; color: var(--cc-text2); }
  .sessundo[hidden] { display: none; }
  .sessundo .ut { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sessundo .ub { flex: 0 0 auto; background: transparent; border: none; color: var(--cc-accent); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .sessundo .ub:hover { text-decoration: underline; }
  /* Memory tab (§M3): a second surface beside History for the recorded outcomes — edit or forget. */
  .svtabs { display: flex; gap: 2px; padding: 6px 10px 0; flex: 0 0 auto; }
  .svtab { flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--cc-text3); font: inherit; font-size: 12px; padding: 6px 4px 7px; cursor: pointer; }
  .svtab:hover { color: var(--cc-text); }
  .svtab.on { color: var(--cc-text); border-bottom-color: var(--cc-accent); }
  .svpane { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .svpane[hidden] { display: none; }
  .svmemhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 12px 4px; font-size: 11px; color: var(--cc-text3); }
  .svmemopen { background: transparent; border: none; color: var(--cc-accent); font: inherit; font-size: 11px; cursor: pointer; padding: 0; white-space: nowrap; }
  .svmemopen:hover { text-decoration: underline; }
  .memcard { position: relative; padding: 9px 8px; border-bottom: 1px solid var(--cc-line); cursor: pointer; }
  .memcard:last-child { border-bottom: none; }
  .memcard:hover { background: color-mix(in srgb, var(--cc-text3) 13%, transparent); }
  .memcard:focus-visible { background: color-mix(in srgb, var(--cc-accent) 15%, transparent); outline: none; }
  .memcard .memtext { font-size: 13px; line-height: 1.45; color: var(--cc-text); }
  .memcard .memline2 { display: flex; align-items: center; min-height: 22px; margin-top: 3px; }
  .memcard .memmeta { flex: 1 1 auto; min-width: 0; font-size: 11.5px; color: var(--cc-text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memcard .memacts { display: none; align-items: center; gap: 4px; flex: 0 0 auto; }
  .memcard:hover .memmeta, .memcard:focus-within .memmeta { display: none; }
  .memcard:hover .memacts, .memcard:focus-within .memacts { display: flex; }
  .memcard .memact { background: transparent; border: none; color: var(--cc-text2); border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .memcard .memact:hover { background: color-mix(in srgb, var(--cc-text3) 20%, transparent); color: var(--cc-text); }
  .memcard .memact[data-act="forget"]:hover { background: color-mix(in srgb, var(--cc-danger) 18%, transparent); color: var(--cc-danger); }
  /* Facts section (§M3/§6): durable truths, marked inferred vs confirmed, with confirm / not-true. */
  .memsection { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--cc-text3); margin: 12px 4px 6px; }
  .factcard { position: relative; padding: 9px 8px; border-bottom: 1px solid var(--cc-line); }
  .factcard:last-child { border-bottom: none; }
  .factcard:hover { background: color-mix(in srgb, var(--cc-text3) 10%, transparent); }
  .factcard.inferred { opacity: .82; }
  .factcard.superseded { opacity: .6; }
  .factbadge.warn { color: var(--cc-warn); border-color: color-mix(in srgb, var(--cc-warn) 45%, var(--cc-line)); }
  .factcard .facttext { font-size: 13px; line-height: 1.5; color: var(--cc-text); }
  .factbadge { font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--cc-text3); border: 1px solid var(--cc-line); border-radius: 4px; padding: 0 4px; margin-left: 2px; white-space: nowrap; }
  .factbadge.ok { color: var(--cc-accent); border-color: color-mix(in srgb, var(--cc-accent) 45%, var(--cc-line)); }
  .factcard .memline2 { display: flex; align-items: center; min-height: 22px; margin-top: 3px; }
  .factcard .memmeta { flex: 1 1 auto; font-size: 11px; color: var(--cc-text3); }
  .factcard .memacts { display: none; align-items: center; gap: 4px; flex: 0 0 auto; }
  .factcard:hover .memmeta, .factcard:focus-within .memmeta { display: none; }
  .factcard:hover .memacts, .factcard:focus-within .memacts { display: flex; }
  .factcard .memact[data-fact="remove"]:hover { background: color-mix(in srgb, var(--cc-danger) 18%, transparent); color: var(--cc-danger); }
  .factcard .memact[data-fact="confirm"]:hover { background: color-mix(in srgb, var(--cc-accent) 18%, transparent); color: var(--cc-accent); }
  .sesslist { flex: 1 1 auto; overflow-y: auto; padding: 0 10px 12px; }
  .sessbucket { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--cc-text3); margin: 12px 4px 7px; }
  .sessbucket .cnt { letter-spacing: 0; }
  .sessempty { padding: 44px 16px; text-align: center; color: var(--cc-text3); font-size: 13px; line-height: 1.6; }
  /* flat, VS Code-minimal rows: a status dot + title + time, no card box; selection is a subtle full-row tint */
  .sesscard { position: relative; padding: 9px 8px; border-bottom: 1px solid var(--cc-line); cursor: pointer; transition: background .1s; }
  .sesscard:last-child { border-bottom: none; }
  /* the last row of a group needs no divider — the header gap already separates it (progressive :has) */
  .sesscard:has(+ .sessbucket), .memcard:has(+ .memsection), .factcard:has(+ .memsection) { border-bottom: none; }
  .sesscard:hover { background: color-mix(in srgb, var(--cc-text3) 13%, transparent); }
  .sesscard:focus-visible { background: color-mix(in srgb, var(--cc-accent) 15%, transparent); outline: none; }
  .sesscard .sesstop { display: flex; align-items: center; gap: 10px; }
  .sesscard .sesstop::before { content: ''; flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--cc-text3); }
  .sesscard.warn .sesstop::before { background: var(--cc-warn); }
  .sesscard.err .sesstop::before { background: var(--cc-danger); }
  .sesscard.res .sesstop::before { background: var(--cc-accent); }
  .sesscard .sessname { font-weight: 400; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  /* Line 2 shares its slot: at rest the file·time line; on hover the labeled buttons take the same
     fixed-height row (min-height) at full width — nothing wraps, reflows, or floats, and the title above is
     left intact. Sidebar buttons are label-only (icon hidden) to stay compact in a narrow panel. */
  .sesscard .sessline2 { margin: 2px 0 0 16px; min-height: 22px; display: flex; align-items: center; }
  .sesscard .sesssub { font-size: 12px; color: var(--cc-text3); }
  /* Same reasoning as chat.html: the row is nowrap, so a fifth button must not overflow a narrow
     pane. Below the width where five labelled buttons fit, drop to icons — title + aria-label are
     already on every button, so only the eye loses anything, and only when there is no room. */
  .sesscard { container-type: inline-size; }
  @container (max-width: 400px) { .sesscard .sesslbl { display: none; } }
  .sesscard .sessacts { display: none; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .sesscard:hover .sesssub, .sesscard:focus-within .sesssub { display: none; }
  .sesscard:hover .sessacts, .sesscard:focus-within .sessacts { display: flex; }
  .sesscard .sessact { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: none; background: transparent; color: var(--cc-text2); border-radius: 4px; cursor: pointer; font: inherit; font-size: 11px; white-space: nowrap; }
  .sesscard .sessact .ci { display: none; }
  .sesscard .sessact:hover { background: color-mix(in srgb, var(--cc-text3) 20%, transparent); color: var(--cc-text); }
  .sesscard .sessact[data-act="delete"]:hover { background: color-mix(in srgb, var(--cc-danger) 18%, transparent); color: var(--cc-danger); }
  .sesscard.pinned [data-act="pin"] { color: var(--cc-accent); }
  @media (prefers-reduced-motion: reduce) { .sesscard { transition: none; } }
</style>
</head>
<body>
  <div class="sessview">
    <div class="svtabs">
      <button class="svtab on" data-tab="history" type="button">History</button>
      <button class="svtab" data-tab="memory" type="button">Memory</button>
    </div>
    <div class="svpane" id="paneHistory">
      <button id="svNew" class="sessnew" type="button">New Session</button>
      <div class="sesslist" id="svList"></div>
    </div>
    <div class="svpane" id="paneMemory" hidden>
      <div class="svmemhead"><span>What this project remembers</span><button class="svmemopen" id="svMemOpen" type="button">open file &#8599;</button></div>
      <div class="sesslist" id="svMemList"></div>
    </div>
    <div class="sessundo" id="svUndo" hidden></div>
  </div>
<script nonce="__NONCE__">
  const vscode = acquireVsCodeApi();
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function escAttr(s){ return esc(s); }
  // [SESSIONS-PURE-START] — dependency-free helpers; extracted + unit-tested in test/sessionsUi.test.js.
  function sessRelTime(iso, nowMs){
    const t = Date.parse(iso); if (!isFinite(t)) { return ''; }
    const s = Math.max(0, Math.round((nowMs - t) / 1000));
    if (s < 45) { return 'just now'; }
    const m = Math.round(s / 60); if (m < 60) { return m + 'm'; }
    const h = Math.round(m / 60); if (h < 24) { return h + 'h'; }
    const d = Math.round(h / 24); if (d < 7) { return d + 'd'; }
    const w = Math.round(d / 7); if (w < 5) { return w + 'w'; }
    try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return d + 'd'; }
  }
  function sessBucket(iso, nowMs){
    const t = Date.parse(iso); if (!isFinite(t)) { return 'Earlier'; }
    const startOfDay = (ms) => { const dt = new Date(ms); dt.setHours(0, 0, 0, 0); return dt.getTime(); };
    const days = Math.round((startOfDay(nowMs) - startOfDay(t)) / 86400000);
    if (days <= 0) { return 'Today'; }
    if (days === 1) { return 'Yesterday'; }
    if (days <= 7) { return 'This week'; }
    return 'Earlier';
  }
  function sessModelShort(m){ const s = String(m || ''); const i = s.lastIndexOf('/'); return i >= 0 ? s.slice(i + 1) : s; }
  // Inline codicons (self-contained — the shared block can't reach the chat's codicon() helper). play is a
  // plain triangle; edit/check/trash are the editor's own glyphs; star doubles as the pin toggle.
  var SESS_IC = {
    edit: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14.236 1.76386C13.2123 0.740172 11.5525 0.740171 10.5289 1.76386L2.65722 9.63549C2.28304 10.0097 2.01623 10.4775 1.88467 10.99L1.01571 14.3755C0.971767 14.5467 1.02148 14.7284 1.14646 14.8534C1.27144 14.9783 1.45312 15.028 1.62432 14.9841L5.00978 14.1151C5.52234 13.9836 5.99015 13.7168 6.36433 13.3426L14.236 5.47097C15.2596 4.44728 15.2596 2.78755 14.236 1.76386ZM11.236 2.47097C11.8691 1.8378 12.8957 1.8378 13.5288 2.47097C14.162 3.10413 14.162 4.1307 13.5288 4.76386L12.75 5.54269L10.4571 3.24979L11.236 2.47097ZM9.75002 3.9569L12.0429 6.24979L5.65722 12.6355C5.40969 12.883 5.10023 13.0595 4.76117 13.1465L2.19447 13.8053L2.85327 11.2386C2.9403 10.8996 3.1168 10.5901 3.36433 10.3426L9.75002 3.9569Z"/></svg>',
    check: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.6572 3.13573C13.8583 2.9465 14.175 2.95614 14.3643 3.15722C14.5535 3.35831 14.5438 3.675 14.3428 3.86425L5.84277 11.8642C5.64597 12.0494 5.33756 12.0446 5.14648 11.8535L1.64648 8.35351C1.45121 8.15824 1.45121 7.84174 1.64648 7.64647C1.84174 7.45121 2.15825 7.45121 2.35351 7.64647L5.50976 10.8027L13.6572 3.13573Z"/></svg>',
    trash: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10 3h3v1h-1v9l-1 1H4l-1-1V4H2V3h3V2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zM9 2H6v1h3V2zM4 13h7V4H4v9zm2-8H5v7h1V5zm1 0h1v7H7V5zm2 0h1v7H9V5z"/></svg>',
    star: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5 L9.53 5.9 L14.18 5.99 L10.47 8.8 L11.82 13.26 L8 10.6 L4.18 13.26 L5.53 8.8 L1.82 5.99 L6.47 5.9 Z"/></svg>',
    copy: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2h7l1 1v1h1l1 1v8l-1 1H6l-1-1v-1H4l-1-1V3l1-1zm1 1v8h1V5l1-1h4V3H5zm2 3v8h6V6H7z"/></svg>',
    fork: '<svg class="ci" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 2a2 2 0 0 0-.5 3.93v1.32c0 1.1.9 2 2 2h1.5V11a2 2 0 1 0 1 0V9.25H10c1.1 0 2-.9 2-2V5.93A2 2 0 1 0 11 5.93v1.32a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5.93A2 2 0 0 0 4.5 2zm0 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM8 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>'
  };
  function sessActBtn(act, label, svg, cls){
    return '<button type="button" class="sessact' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" title="' + label + '" aria-label="' + label + '">' + svg + '<span class="sesslbl">' + label + '</span></button>';
  }
  var SESS_BUCKETS = ['Pinned', 'Today', 'Yesterday', 'This week', 'Earlier'];
  function sessGroup(entries, nowMs){
    const by = {}; SESS_BUCKETS.forEach((b) => { by[b] = []; });
    for (const e of entries){ const b = e.pinned ? 'Pinned' : sessBucket(e.updatedAt || e.createdAt, nowMs); (by[b] || by.Earlier).push(e); }
    return SESS_BUCKETS.filter((b) => by[b].length).map((b) => ({ bucket: b, entries: by[b] }));
  }
  // esc/escAttr are INJECTED so this whole block stays pure (unit-testable without the webview globals).
  // Two fixed-height lines: the title, then (primary file · time). On hover the SECOND line swaps to the
  // labeled action buttons — Rename · Done · Delete · Pin — in the same fixed-height row, at full width, so
  // nothing wraps, reflows, or floats and the title is left intact. Clicking the card body resumes (no
  // Resume button). Pinned is shown by the Pinned bucket + the accent Unpin button; secondary detail
  // (model · turns · files) rides the native tooltip.
  function sessCardHtml(e, nowMs, escFn, escAttrFn){
    const st = e.state === 'interrupted' ? ' warn' : e.state === 'error' ? ' err' : e.state === 'resumed' ? ' res' : '';
    const files = e.filesEdited || [];
    const sub = (files.length ? escFn(files[0]) + ' · ' : '') + escFn(sessRelTime(e.updatedAt || e.createdAt, nowMs));
    const turns = e.turns || 0;
    const detail = (e.title || 'Untitled') + ' — ' + turns + ' turn' + (turns === 1 ? '' : 's')
      + (e.model ? ' · ' + sessModelShort(e.model) : '') + (files.length ? ' · ' + files.join(', ') : '');
    const acts = '<span class="sessacts">'
      + sessActBtn('rename', 'Rename', SESS_IC.edit)
      + sessActBtn('fork', 'Fork', SESS_IC.fork)
      + sessActBtn('export', 'Copy', SESS_IC.copy)
      + sessActBtn('done', 'Done', SESS_IC.check)
      + sessActBtn('delete', 'Delete', SESS_IC.trash)
      + sessActBtn('pin', e.pinned ? 'Unpin' : 'Pin', SESS_IC.star)
      + '</span>';
    return '<div class="sesscard' + st + (e.pinned ? ' pinned' : '') + '" data-id="' + escAttrFn(e.id || '') + '" tabindex="0" role="button" aria-label="' + escAttrFn(e.title || 'Untitled') + '" title="' + escAttrFn(detail) + '">'
      + '<div class="sesstop"><span class="sessname">' + escFn(e.title || 'Untitled') + '</span></div>'
      + '<div class="sessline2"><span class="sesssub">' + sub + '</span>' + acts + '</div></div>';
  }
  // [SESSIONS-PURE-END]
  const D = Date.now();
  // Placeholder data so the view renders before the extension.js adapter posts real entries.
  const MOCK_SESSIONS = [
    { id: 's1', title: 'Idempotent refunds via Redis keys', createdAt: new Date(D - 2 * 3600e3).toISOString(), updatedAt: new Date(D - 2 * 3600e3).toISOString(), turns: 41, model: 'anthropic/claude-opus-5', state: 'done', lifecycle: 'active', pinned: true, filesEdited: ['refund.rb', 'redis_lock.rb', 'ledger.rb', 'spec.rb'], spark: [1, 3, 2, 5, 8, 6, 4, 2, 1] },
    { id: 's2', title: 'Debug the flaky payment webhook test', createdAt: new Date(D - 5 * 3600e3).toISOString(), updatedAt: new Date(D - 5 * 3600e3).toISOString(), turns: 12, model: 'moonshotai/kimi-k2.7-code', state: 'interrupted', lifecycle: 'active', pinned: false, filesEdited: ['webhook_spec.rb'], spark: [2, 6, 3, 1] },
    { id: 's3', title: 'Tidy the CHANGELOG for v1.0.4', createdAt: new Date(D - 2 * 86400e3).toISOString(), updatedAt: new Date(D - 2 * 86400e3).toISOString(), turns: 6, model: 'anthropic/claude-opus-5', state: 'done', lifecycle: 'active', pinned: false, filesEdited: ['RELEASE-NOTES.md'], spark: [1, 2, 1] }
  ];
  let sessData = MOCK_SESSIONS.slice();
  function renderSessions(){
    const list = document.getElementById('svList'); if (!list) { return; }
    const entries = (sessData || []).filter((e) => (e.lifecycle || 'active') === 'active');
    if (!entries.length){
      list.innerHTML = '<div class="sessempty">Your saved chats will appear here.</div>';
      return;
    }
    const now = Date.now(); let out = '';
    for (const g of sessGroup(entries, now)){
      out += '<div class="sessbucket"><span>' + (g.bucket === 'Pinned' ? '\u2605 ' : '') + esc(g.bucket) + '</span><span class="cnt">' + g.entries.length + '</span></div>';
      for (const e of g.entries){ out += sessCardHtml(e, now, esc, escAttr); }
    }
    list.innerHTML = out;
  }
  document.getElementById('svNew').addEventListener('click', () => vscode.postMessage({ type: 'newSession' }));
  document.getElementById('svList').addEventListener('click', (e) => {
    const card = e.target.closest && e.target.closest('.sesscard'); if (!card) { return; }
    const id = card.getAttribute('data-id'); const btn = e.target.closest('[data-act]');
    vscode.postMessage({ type: 'sessionAction', action: btn ? btn.getAttribute('data-act') : 'resume', id: id });
  });
  // ── Memory tab (§M3): the recorded outcomes, each with Edit / Forget; click the card to resume it ──
  function memCardHtml(e){
    const files = Array.isArray(e.files) ? e.files : [];
    const when = e.at ? new Date(e.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
    const meta = (files.length ? esc(files[0]) + (files.length > 1 ? ' +' + (files.length - 1) : '') + ' · ' : '') + esc(when);
    return '<div class="memcard" data-id="' + escAttr(e.id || '') + '" tabindex="0" role="button" title="' + escAttr(e.summary || '') + '">'
      + '<div class="memtext">' + esc(e.summary || e.title || 'a session') + '</div>'
      + '<div class="memline2"><span class="memmeta">' + meta + '</span>'
      + '<span class="memacts"><button type="button" class="memact" data-act="edit" title="Edit this memory">Edit</button>'
      + '<button type="button" class="memact" data-act="forget" title="Forget this session">Forget</button></span></div>'
      + '</div>';
  }
  function factCardHtml(f){
    const state = f.superseded ? 'superseded' : f.confirmed ? 'confirmed' : 'inferred';
    const badge = '<span class="factbadge ' + (f.confirmed ? 'ok' : f.superseded ? 'warn' : '') + '">' + state + '</span>';
    const meta = (f.superseded && f.supersededBy) ? 'superseded by: ' + esc(f.supersededBy) : 'seen ' + (f.count || 0) + '×';
    const acts = '<span class="memacts">'
      + (f.confirmed ? '' : '<button type="button" class="memact" data-fact="confirm" title="' + (f.superseded ? 'Keep — still true' : 'Confirm — this is true') + '">' + (f.superseded ? 'Keep' : 'Confirm') + '</button>')
      + '<button type="button" class="memact" data-fact="remove" title="Not true — remove this fact">Not true</button>'
      + '</span>';
    return '<div class="factcard ' + state + '" data-key="' + escAttr(f.key || '') + '">'
      + '<div class="facttext">' + esc(f.text || '') + ' ' + badge + '</div>'
      + '<div class="memline2"><span class="memmeta">' + meta + '</span>' + acts + '</div></div>';
  }
  function renderMemory(msg){
    const list = document.getElementById('svMemList'); if (!list) { return; }
    const items = Array.isArray(msg && msg.items) ? msg.items : [];
    const facts = Array.isArray(msg && msg.facts) ? msg.facts : [];
    let html = '';
    if (facts.length){ html += '<div class="memsection">Facts</div>' + facts.map(factCardHtml).join(''); }
    if (items.length){ html += '<div class="memsection">Sessions</div>' + items.map(memCardHtml).join(''); }
    list.innerHTML = html || '<div class="sessempty">Nothing remembered yet. As sessions finish, what they achieved appears here — plain text you can edit or forget.</div>';
  }
  document.getElementById('svMemList').addEventListener('click', (e) => {
    const fbtn = e.target.closest && e.target.closest('[data-fact]');
    if (fbtn){ const fc = fbtn.closest('.factcard'); vscode.postMessage({ type: 'factAction', action: fbtn.getAttribute('data-fact'), key: fc ? fc.getAttribute('data-key') : '' }); return; }
    const card = e.target.closest && e.target.closest('.memcard'); if (!card) { return; }
    const id = card.getAttribute('data-id'); const btn = e.target.closest('[data-act]');
    vscode.postMessage({ type: 'memoryAction', action: btn ? btn.getAttribute('data-act') : 'resume', id: id });
  });
  document.getElementById('svMemOpen').addEventListener('click', () => vscode.postMessage({ type: 'openMemory' }));
  function showTab(tab){
    const hist = tab === 'history';
    document.getElementById('paneHistory').hidden = !hist;
    document.getElementById('paneMemory').hidden = hist;
    document.querySelectorAll('.svtab').forEach((b) => b.classList.toggle('on', b.getAttribute('data-tab') === tab));
    if (!hist) { vscode.postMessage({ type: 'listMemory' }); }
  }
  document.querySelectorAll('.svtab').forEach((b) => b.addEventListener('click', () => showTab(b.getAttribute('data-tab'))));
  // The Undo toast for Done/Delete — a quick, recoverable safety net. Auto-hides after a few seconds.
  let sessUndoTimer = null;
  function showUndo(m){
    const el = document.getElementById('svUndo'); if (!el) { return; }
    const verb = m.action === 'delete' ? 'Deleted' : 'Archived';
    el.innerHTML = '<span class="ut">' + verb + ' “' + esc(m.title || 'session') + '”</span><button class="ub" data-id="' + escAttr(m.id || '') + '">Undo</button>';
    el.hidden = false;
    clearTimeout(sessUndoTimer); sessUndoTimer = setTimeout(function(){ el.hidden = true; }, 7000);
  }
  document.getElementById('svUndo').addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('.ub'); if (!b) { return; }
    vscode.postMessage({ type: 'sessionAction', action: 'restore', id: b.getAttribute('data-id') });
    document.getElementById('svUndo').hidden = true; clearTimeout(sessUndoTimer);
  });
  window.addEventListener('message', (ev) => { const m = ev.data; if (m && m.type === 'sessions'){ sessData = Array.isArray(m.entries) ? m.entries : []; renderSessions(); } else if (m && m.type === 'memoryList'){ renderMemory(m); } else if (m && m.type === 'sessionUndo'){ showUndo(m); } });
  renderSessions();
  vscode.postMessage({ type: 'listSessions' });
</script>
</body>
</html>
