<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; padding:0; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: transparent; display:flex; flex-direction:column; height:100vh; }
  #log { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 10px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; line-height:1.45; }
  .user { background: var(--vscode-input-background); border:1px solid var(--vscode-input-border, transparent); }
  .assistant { background: var(--vscode-editorWidget-background, rgba(127,127,127,.08)); }
  .role { font-size:11px; opacity:.6; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .err { color: var(--vscode-errorForeground); }
  pre { background: var(--vscode-textCodeBlock-background, rgba(127,127,127,.15)); padding:8px; border-radius:6px; overflow-x:auto; }
  code { font-family: var(--vscode-editor-font-family, monospace); }
  #empty { opacity:.6; padding:18px; text-align:center; }
  #ctx { margin:0 10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 8px; border-radius:10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
  #bar { border-top:1px solid var(--vscode-panel-border, rgba(127,127,127,.25)); padding:8px; display:flex; flex-direction:column; gap:6px; }
  #row { display:flex; gap:6px; align-items:flex-end; }
  textarea { flex:1; resize:none; min-height:34px; max-height:140px; padding:7px 9px; border-radius:6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border:1px solid var(--vscode-input-border, var(--vscode-contrastBorder, #8884)); font-family:inherit; font-size:inherit; box-sizing:border-box; }
  button { cursor:pointer; border:none; border-radius:6px; padding:7px 12px; color: var(--vscode-button-foreground); background: var(--vscode-button-background); }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.secondary { color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); }
  #meta { display:flex; justify-content:space-between; align-items:center; font-size:11px; opacity:.7; }
  #meta a { color: var(--vscode-textLink-foreground); cursor:pointer; }
</style>
</head>
<body>
  <div id="log"><div id="empty">Ask Atom++ AI about your code.<br>Use <b>Add selection</b> (or ⌥⌘A) to send the selected code as context.</div></div>
  <div id="ctx"></div>
  <div id="bar">
    <div id="meta"><a id="model" title="Click to change model">…</a><span><a id="addsel">Add selection</a> · <a id="new">New chat</a></span></div>
    <div id="row">
      <textarea id="input" placeholder="Message Atom++ AI…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
      <button id="stop" class="secondary" style="display:none">Stop</button>
    </div>
  </div>
<script nonce="__NONCE__">
  const vscode = acquireVsCodeApi();
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const stopBtn = document.getElementById('stop');
  const ctxEl = document.getElementById('ctx');
  const FENCE = String.fromCharCode(96, 96, 96);
  const TICK = String.fromCharCode(96);
  let current = null;
  let raw = '';
  let activeFileLabel = null;
  let selLabel = null;

  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function renderChips(){
    let h = '';
    if (activeFileLabel){ h += '<span class="chip" title="The open file is sent to the AI as context">📄 ' + esc(activeFileLabel) + '</span> '; }
    if (selLabel){ h += '<span class="chip">📎 ' + esc(selLabel) + '</span>'; }
    ctxEl.innerHTML = h;
  }
  function render(md){
    const parts = md.split(FENCE);
    let out = '';
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        const body = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, '');
        out += '<pre><code>' + esc(body) + '</code></pre>';
      } else {
        const inlineCode = new RegExp(TICK + '([^' + TICK + ']+)' + TICK, 'g');
        out += esc(parts[i]).replace(inlineCode, '<code>$1</code>');
      }
    }
    return out;
  }
  function clearEmpty(){ const e = document.getElementById('empty'); if (e) e.remove(); }
  function add(role, html){
    clearEmpty();
    const d = document.createElement('div'); d.className = 'msg ' + role;
    d.innerHTML = '<div class="role">' + (role === 'user' ? 'You' : 'Atom++ AI') + '</div><div class="body">' + html + '</div>';
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d.querySelector('.body');
  }
  function doSend(){
    const t = input.value.trim(); if (!t) return;
    add('user', render(t)); input.value = ''; input.style.height = '34px';
    vscode.postMessage({ type: 'send', text: t });
  }
  sendBtn.onclick = doSend;
  stopBtn.onclick = () => vscode.postMessage({ type: 'stop' });
  document.getElementById('addsel').onclick = () => vscode.postMessage({ type: 'addSelection' });
  document.getElementById('new').onclick = () => vscode.postMessage({ type: 'newChat' });
  document.getElementById('model').onclick = () => vscode.postMessage({ type: 'pickModel' });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doSend(); } });
  input.addEventListener('input', () => { input.style.height = '34px'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });

  window.addEventListener('message', ev => {
    const m = ev.data;
    if (m.type === 'config'){ document.getElementById('model').textContent = (m.provider === 'claude' ? 'Claude' : 'Ollama') + ' · ' + m.model + ' ▾'; }
    else if (m.type === 'assistantStart'){ raw = ''; current = add('assistant', ''); sendBtn.style.display = 'none'; stopBtn.style.display = ''; }
    else if (m.type === 'assistantDelta'){ raw += m.text; if (current){ current.innerHTML = render(raw); log.scrollTop = log.scrollHeight; } }
    else if (m.type === 'assistantDone'){ current = null; sendBtn.style.display = ''; stopBtn.style.display = 'none'; }
    else if (m.type === 'assistantError'){ add('assistant', '<span class="err">' + esc(m.message) + '</span>'); sendBtn.style.display = ''; stopBtn.style.display = 'none'; current = null; }
    else if (m.type === 'activeFile'){ activeFileLabel = m.label; renderChips(); }
    else if (m.type === 'context'){ selLabel = m.label; renderChips(); }
    else if (m.type === 'clearContext'){ selLabel = null; renderChips(); }
    else if (m.type === 'reset'){ log.innerHTML = '<div id="empty">New chat started.</div>'; selLabel = null; renderChips(); current = null; sendBtn.style.display = ''; stopBtn.style.display = 'none'; }
  });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
